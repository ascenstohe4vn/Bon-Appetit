name: Release

on:
  push:
    tags:
      - 'v**'
      - '!v*-dev**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get branch name
        id: get_branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Get MC version and mod version
        uses: christian-draeger/read-properties@908f99d3334be3802ec7cb528395a69d19914e7b
        id: read_properties
        with:
          path: gradle.properties
          properties: 'mod_id mod_version'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            loom-cache

      - name: Build jar
        env:
          RELEASE: true
        run: ./gradlew build

      - name: Publish to Maven Repository
        env:
          RELEASE: true
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_ACCESS_TOKEN: ${{ secrets.MAVEN_ACCESS_TOKEN }}
        if: env.MAVEN_USER != '' && env.MAVEN_ACCESS_TOKEN != '' && env.GITHUB_TOKEN != ''
        run: ./gradlew publish -PrealRobotixMavenUsername=${{ secrets.MAVEN_USER }} -PrealRobotixMavenPassword=${{ secrets.MAVEN_ACCESS_TOKEN }}

      - name: Find jars
        id: find_jars
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "jars<<$EOF" >> $GITHUB_OUTPUT
          find ./build/libs/ -type f -name "*.jar" ! -name "*-sources.jar" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Generate Release Changelog
        id: release_changelog
        run: |
          REPO="${{ github.repository }}"
          CURRENT_TAG="${{ github.ref_name }}"
          
          PREV_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || true)
          
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$CURRENT_TAG"
            COMPARE_URL="https://github.com/$REPO/compare/$PREV_TAG...$CURRENT_TAG"
          else
            RANGE="$CURRENT_TAG"
            COMPARE_URL="https://github.com/$REPO/commits/$CURRENT_TAG"
          fi

          COMMIT_COUNT=$(git rev-list --count $RANGE)

          if [ "$COMMIT_COUNT" -gt 32 ]; then
            COMMITS=$(git log --format="* [\`%h\`](https://github.com/$REPO/commit/%H) %s - by %an" -n 32 $RANGE)
            COMMITS="$COMMITS\n* ...and $((COMMIT_COUNT - 32)) more commits. [View full changelog]($COMPARE_URL)"
          else
            COMMITS=$(git log --format="* [\`%h\`](https://github.com/$REPO/commit/%H) %s - by %an" $RANGE)
          fi

          PAYLOAD=$(jq -n \
            --arg title "Building new release: ${{ steps.read_properties.outputs.mod_version }}" \
            --arg desc "$COMMITS" \
            '{embeds: [{title: $title, description: $desc, color: 16711935}]}')

          echo "payload=$PAYLOAD" >> $GITHUB_OUTPUT

      - name: Send building message to discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAYLOAD: ${{ steps.release_changelog.outputs.payload }}
        if: env.DISCORD_WEBHOOK != ''
        run: |
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Send built file to discord
        env:
          JARS: ${{ steps.find_jars.outputs.jars }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.DISCORD_WEBHOOK != ''
        run: |
          while IFS= read -r f
            do curl -F "file=@$f" $DISCORD_WEBHOOK
          done <<< "$JARS"

      - name: Archive Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.read_properties.outputs.mod_id }}-${{ steps.read_properties.outputs.mod_version }}+build.${{ github.run_number }}
          path: ${{ steps.find_jars.outputs.jars }}