name: Nightly Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get branch name
        id: get_branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Get MC version and mod version
        uses: christian-draeger/read-properties@908f99d3334be3802ec7cb528395a69d19914e7b
        id: read_properties
        with:
          path: gradle.properties
          properties: 'mod_id mod_version'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            loom-cache

      - name: Build jar
        run: ./gradlew build -PbuildSuffix="-nightly.${{ github.run_number }}"

      - name: Publish to Maven Repository
        env:
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_ACCESS_TOKEN: ${{ secrets.MAVEN_ACCESS_TOKEN }}
        if: env.MAVEN_USER != '' && env.MAVEN_ACCESS_TOKEN != '' && env.GITHUB_TOKEN != ''
        run: ./gradlew publish -PrealRobotixMavenUsername=${{ secrets.MAVEN_USER }} -PrealRobotixMavenPassword=${{ secrets.MAVEN_ACCESS_TOKEN }} -PbuildSuffix="-nightly+${{ github.run_number }}"

      - name: Find jars
        id: find_jars
        run: |
          JARS=$(find ./build/libs/ -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | tr '\n' ' ')
          echo "jars=$JARS" >> $GITHUB_OUTPUT

      - name: Generate Discord Nightly Message
        id: discord_msg
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          BRANCH="${{ steps.get_branch.outputs.branch }}"
          REPO="${{ github.repository }}"
          
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            SHORT_BEFORE=$(echo "$BEFORE_SHA" | cut -c1-7)
            SHORT_AFTER=$(echo "$AFTER_SHA" | cut -c1-7)
            RANGE_LINK="[\`$SHORT_BEFORE...$SHORT_AFTER\`](https://github.com/$REPO/compare/$BEFORE_SHA...$AFTER_SHA)"
            COMMITS=$(git log --format="* [\`%h\`](https://github.com/$REPO/commit/%H) %s - by %an" $BEFORE_SHA..$AFTER_SHA 2>/dev/null)
          else
            SHORT_AFTER=$(echo "$AFTER_SHA" | cut -c1-7)
            RANGE_LINK="[\`$SHORT_AFTER\`](https://github.com/$REPO/commit/$AFTER_SHA)"
            COMMITS=$(git log -1 --format="* [\`%h\`](https://github.com/$REPO/commit/%H) %s - by %an")
          fi

          PAYLOAD=$(jq -n \
            --arg title "Building mod from branch $BRANCH" \
            --arg desc "$RANGE_LINK\n\n$COMMITS" \
            '{embeds: [{title: $title, description: $desc, color: 16711935}]}')

          echo "payload=$PAYLOAD" >> $GITHUB_OUTPUT

      - name: Send building message to discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAYLOAD: ${{ steps.discord_msg.outputs.payload }}
        if: env.DISCORD_WEBHOOK != '' && github.event_name == 'push'
        run: |
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Send built file to discord
        env:
          JARS: ${{ steps.find_jars.outputs.jars }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.DISCORD_WEBHOOK != '' && env.JARS != ''
        run: |
          for jar in $JARS; do
            echo "Uploading $jar to Discord..."
            curl -F "file=@$jar" "$DISCORD_WEBHOOK"
          done

      - name: Archive Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.read_properties.outputs.mod_id }}-${{ steps.read_properties.outputs.mod_version }}+build.${{ github.run_number }}
          path: ${{ steps.find_jars.outputs.jars }}